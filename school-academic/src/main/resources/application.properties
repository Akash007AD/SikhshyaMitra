server.port=8082
spring.application.name=school-academic

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/sp_academic?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=svc_academic
spring.datasource.password=academic_pass

# Hibernate / JPA (We use validate because Flyway creates tables)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway configuration for database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
