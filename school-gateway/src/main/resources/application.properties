server.port=8080
spring.application.name=school-gateway

# ── Gateway Routing Rules ─────────────────────────────────────────────────
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service-route
spring.cloud.gateway.server.webmvc.routes[0].uri=http://127.0.0.1:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**,/api/tenants/**

spring.cloud.gateway.server.webmvc.routes[1].id=academic-service-route
spring.cloud.gateway.server.webmvc.routes[1].uri=http://127.0.0.1:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/academic/**

# ── JWT (MUST match school-auth exactly) ─────────────────────────────────
# Set JWT_SECRET environment variable — same value as school-auth
jwt.secret=${JWT_SECRET:LocalDevOnlySecretKeyThatIsAtLeast64CharactersLongForHS256!}

# ── Actuator ──────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,gateway
