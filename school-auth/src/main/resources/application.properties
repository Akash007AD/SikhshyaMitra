spring.application.name=school-auth

# ── Database ──────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/sp_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=svc_auth
spring.datasource.password=auth_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP tuning
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ── JPA / Hibernate ───────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Flyway ────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repair=true

# ── Server ────────────────────────────────────────────────────────────────
server.port=8081

# ── JWT (loaded from environment — NEVER hardcode in production) ──────────
# Set JWT_SECRET environment variable to a 64+ character random string
jwt.secret=${JWT_SECRET:LocalDevOnlySecretKeyThatIsAtLeast64CharactersLongForHS256!}
jwt.expiration.ms=900000
jwt.refresh.expiration.days=30

# ── Google OAuth ──────────────────────────────────────────────────────────
# Set GOOGLE_CLIENT_ID environment variable (from Google Cloud Console)
google.oauth.client-id=${GOOGLE_CLIENT_ID:158914712095-ega2g88usu4nnad3nbeqkqfj33j5oq5i.apps.googleusercontent.com}

# ── Scheduling (for refresh token cleanup) ────────────────────────────────
spring.task.scheduling.pool.size=2
